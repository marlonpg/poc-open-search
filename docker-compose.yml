# Local OpenSearch playground: one OpenSearch node + OpenSearch Dashboards (the web UI).
# Security plugin is DISABLED so you can use plain http without passwords.
# Never do this in production.
services:
  opensearch:
    image: opensearchproject/opensearch:2.19.1
    container_name: poc-opensearch
    environment:
      - discovery.type=single-node          # one node, no cluster formation
      - DISABLE_SECURITY_PLUGIN=true        # plain http, no auth (POC only!)
      - DISABLE_INSTALL_DEMO_CONFIG=true
      - OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m
    ulimits:
      memlock: { soft: -1, hard: -1 }
      nofile: { soft: 65536, hard: 65536 }
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    ports:
      - "9200:9200"   # REST API
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -qv '\"status\":\"red\"'"]
      interval: 10s
      timeout: 5s
      retries: 30

  dashboards:
    image: opensearchproject/opensearch-dashboards:2.19.1
    container_name: poc-dashboards
    environment:
      - OPENSEARCH_HOSTS=["http://opensearch:9200"]
      - DISABLE_SECURITY_DASHBOARDS_PLUGIN=true
    ports:
      - "5601:5601"   # web UI -> http://localhost:5601
    depends_on:
      opensearch:
        condition: service_healthy

volumes:
  opensearch-data:
